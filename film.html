        <script>
          // Fonction pour vérifier l'état de connexion
          function checkLoginStatus() {
              fetch('check_session.php') // Appeler le script PHP
                  .then(response => response.json())
                  .then(data => {
                      const container = document.getElementById('login-logout-container');
                      if (data.logged_in) {
                          // Si l'utilisateur est connecté
                          container.innerHTML = '<a href="logout.php"><button class="botton">Déconnexion</button></a>';
                      } else {
                          alert('Vous devez être connecté pour accéder à cette page.');
                          window.location.href = 'form.html'; // Rediriger l'utilisateur vers la page de connexion
                      }
                  })
                  .catch(error => console.error('Erreur lors de la vérification de la session:', error));
          }
    
          // Vérifier l'état de connexion au chargement de la page
          document.addEventListener('DOMContentLoaded', checkLoginStatus);
      </script>
        <script>
          fetch('get_images.php')  // Fichier PHP pour récupérer les images
              .then(response => response.json())  // Convertir la réponse en JSON
              .then(images => {
                  const container = document.getElementById('main-poster');
                  
                  images.forEach(image => {
                      // Création de la carte pour chaque film
                      const card = document.createElement('div');
                      card.classList.add('card');
          
                      // Créer un lien autour de toute la carte pour la rendre cliquable
                      const cardLink = document.createElement('a');
                      cardLink.href = `show.html?id=${image.id}`;  // Lien vers la page show.html avec l'ID du film
                      cardLink.classList.add('card-link');  // Ajouter une classe CSS pour personnaliser le style du lien
                      
                      // Affichage de l'image dans la carte
                      const poster = document.createElement('div');
                      poster.classList.add('poster');
                      const imgElement = document.createElement('img');
                      imgElement.src = image.chemin;  // Chemin de l'image depuis la base de données
                      imgElement.alt = image.nom;
                      poster.appendChild(imgElement);
          
                      // Affichage des détails de l'image (nom, description, etc.)
                      const dataliste = document.createElement('div');
                      dataliste.classList.add('dataliste');
                      const title = document.createElement('h1');
                      title.textContent = image.nom;  // Nom de l'image
                      const description = document.createElement('p');
                      description.textContent = image.description;  // Description du film récupérée depuis la base de données
                      const star = document.createElement('div');
                      star.classList.add('star');
          
                      // Création des étoiles pour la notation
                      for (let i = 5; i >= 1; i--) {
                          const input = document.createElement('input');
                          input.type = 'radio';
                          input.id = 'star' + i + image.nom;  // ID unique par nom d'image
                          input.name = 'rating_' + image.nom;
                          input.classList.add('star' + i);
                          const label = document.createElement('label');
                          label.setAttribute('for', 'star' + i + image.nom);
                          // label.textContent = '★'; // Vous pouvez ajouter une icône ou un texte ici pour les étoiles
                          star.appendChild(input);
                          star.appendChild(label);
                      }
          
                      // Bouton pour ajouter aux favoris
                      const button = document.createElement('button');
                      button.appendChild(document.createTextNode('Watch Now'));

          
                      // Ajouter les éléments à la carte
                      dataliste.appendChild(title);
                      dataliste.appendChild(description);
                      dataliste.appendChild(star);
                      dataliste.appendChild(button);
                      // Ajouter l'image et les détails au lien
                      cardLink.appendChild(poster);
                      cardLink.appendChild(dataliste);
          
                      // Ajouter le lien à la carte
                      card.appendChild(cardLink);
          
                      // Ajouter la carte au conteneur
                      container.appendChild(card);
                  });
              })
              .catch(error => {
                  console.error('Erreur:', error);
              });
          </script>

  <script>
    function checkLoginStatus() {
            fetch('check_session.php')
                .then(response => response.json())
                .then(data => {
                    const loginLogoutContainer = document.getElementById('login-logout-container');
                    const filmManagementLink = document.getElementById('film-management');

                    if (data.logged_in) {
                        // Afficher le bouton de déconnexion
                        loginLogoutContainer.innerHTML = '<a href="index.html" onclick="logoutUser()"><button class="botton">Déconnexion</button></a>';

                        // Afficher le lien "Gestion des films"
                        filmManagementLink.style.display = 'block';
                    } else {
                        // Afficher le bouton de connexion
                        loginLogoutContainer.innerHTML = '<a href="form.html"><button class="botton">Login</button></a>';

                        // Masquer le lien "Gestion des films"
                        filmManagementLink.style.display = 'none';
                    }
                })
                .catch(error => console.error('Erreur lors de la vérification de la session:', error));
        } 
        document.addEventListener('DOMContentLoaded', checkLoginStatus);
  </script>
  <script>
    function logoutUser() {
            fetch('logout.php')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        checkLoginStatus(); // Réactualiser l'état après la déconnexion
                    }
                })
                .catch(error => console.error('Erreur lors de la déconnexion:', error));
        }
    
        // Vérifiez l'état de connexion au chargement
        document.addEventListener('DOMContentLoaded', checkLoginStatus);
    
  </script>


<!-- scripte bar de recherche -->

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('link');
        const resultsContainer = document.createElement('div');
        resultsContainer.id = 'search-results';
        
        // Styles du conteneur des résultats
        resultsContainer.style.position = 'absolute';
        resultsContainer.style.backgroundColor = '#fff';
        resultsContainer.style.border = '1px solid #ccc';
        resultsContainer.style.borderRadius = '8px';
        resultsContainer.style.width = `${searchInput.offsetWidth}px`; // Même largeur que le champ
        resultsContainer.style.maxHeight = '300px';
        resultsContainer.style.overflowY = 'auto';
        resultsContainer.style.boxShadow = '0 4px 8px rgba(0, 0, 0, 0.1)';
        resultsContainer.style.padding = '10px';
        resultsContainer.style.zIndex = '1000';
        resultsContainer.style.display = 'none'; // Masqué par défaut

        // Positionner au-dessus du champ
        const inputRect = searchInput.getBoundingClientRect();
        resultsContainer.style.top = `${inputRect.height + 4}px`; // Juste au-dessus du champ
        resultsContainer.style.left = '0';

        // Ajouter le conteneur sous le champ de recherche
        searchInput.parentNode.style.position = 'relative'; // Le parent doit être en position relative
        searchInput.parentNode.appendChild(resultsContainer);

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.trim();

            if (query) {
                fetch(`search_film.php?q=${encodeURIComponent(query)}`)
                    .then(response => response.json())
                    .then(films => {
                        resultsContainer.innerHTML = '';
                        resultsContainer.style.display = 'block';

                        if (films.length === 0) {
                            resultsContainer.innerHTML = '<p style="padding: 10px; text-align: center; color: #777;">Aucun film trouvé.</p>';
                        } else {
                            films.forEach(film => {
                                const filmItem = document.createElement('div');
                                filmItem.style.display = 'flex';
                                filmItem.style.alignItems = 'center';
                                filmItem.style.padding = '10px';
                                filmItem.style.cursor = 'pointer';
                                filmItem.style.borderBottom = '1px solid #eee';
                                filmItem.style.transition = 'background-color 0.3s';
                                filmItem.style.gap = '10px';

                                filmItem.addEventListener('mouseover', () => {
                                    filmItem.style.backgroundColor = '#f9f9f9';
                                });
                                filmItem.addEventListener('mouseout', () => {
                                    filmItem.style.backgroundColor = 'transparent';
                                });

                                const image = document.createElement('img');
                                image.src = film.chemin || 'placeholder.png';
                                image.alt = film.nom;
                                image.style.width = '50px';
                                image.style.height = '50px';
                                image.style.borderRadius = '4px';
                                image.style.objectFit = 'cover';

                                const textContainer = document.createElement('div');
                                const title = document.createElement('strong');
                                title.textContent = film.nom;
                                title.style.fontSize = '14px';

                                textContainer.appendChild(title);

                                filmItem.appendChild(image);
                                filmItem.appendChild(textContainer);

                                filmItem.addEventListener('click', () => {
                                    window.location.href = `show.html?id=${film.id}`;
                                });

                                resultsContainer.appendChild(filmItem);
                            });
                        }
                    })
                    .catch(error => console.error('Erreur lors de la recherche:', error));
            } else {
                resultsContainer.innerHTML = '';
                resultsContainer.style.display = 'none';
            }
        });

        document.addEventListener('click', (event) => {
            if (!searchInput.contains(event.target) && !resultsContainer.contains(event.target)) {
                resultsContainer.style.display = 'none';
            }
        });
    });
</script>
