<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/pg/WhatsApp Image 2024-04-29 à 18.36.19_cd6fd2e1.jpg">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Profil Utilisateur</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="global">
        <div class="navbar">
            <div class="nav-left">
                <a href="index.html">CHAGU MOVIES</a>
            </div>
            <div class="nav-center">
                <a href="index.html">Home</a>
                <a href="film.html">Movies</a>
                <a href="Contact us.html">Contact us</a>
            </div>
            <a href="ajouter_supprimer_film.html" id="film-management" style="display: none;">Gestion des films</a>
            <div class="nav-right">
                <!-- Dropdown structure -->
                <div id="login-logout-container-1" class="dropdown">
                    <button class="btn dropdown-toggle" type="button" id="profileDropdown-1" data-bs-toggle="dropdown" aria-expanded="false">
                        <span class="material-icons">account_circle</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown-1">
                        <!-- Les options seront insérées ici dynamiquement -->
                    </ul>
                </div>
            </div>
        </div>



        <div class="container">
            <div class="left-section">
                <div class="profile-picture">
                    <img src="path_to_current_image.jpg" alt="Photo de profil" id="profileImage">
                </div>
            </div>
    
            <div class="right-section">
                <h2>Informations utilisateur</h2>
                <p><strong>Nom :</strong> <span id="username"></span></p>
                <p><strong>Email :</strong> <span id="email"></span></p>
                <p><strong>Films favoris :</strong> <span id="favoriteMovies"></span></p>
    
                <div class="button-container">
                    <button id="changeProfileButton" class="button">Changer la photo de profil</button>
                    <button id="changeUsernameButton" class="button">Changer le nom d'utilisateur</button>
                </div>
    
                <div id="profileForm" class="form-container" style="display: none;">
                    <form action="upload_profile.php" method="POST" enctype="multipart/form-data">
                        <label for="profile_photo">Choisir une nouvelle photo :</label>
                        <input type="file" name="profile_photo" id="profile_photo" required>
                        <button type="submit" class="button">Changer la photo</button>
                    </form>
                </div>
    
                <div id="usernameForm" class="form-container" style="display: none;">
                    <form action="update_profile.php" method="POST" id="usernameForm">
                        <label for="new_username">Nouveau nom d'utilisateur :</label>
                        <input type="text" name="new_username" id="new_username" required placeholder="Nouveau nom d'utilisateur">
    
                        <label for="password">Mot de passe :</label>
                        <input type="password" name="password" id="password" required placeholder="Entrez votre mot de passe pour confirmer">
    
                        <button type="submit" class="button">Changer le nom d'utilisateur</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
   


    <script>
        // Fonction pour vérifier l'état de connexion
        function checkLoginStatus() {
            fetch('check_session.php')
                .then(response => response.json())
                .then(data => {
                    const dropdownMenu = document.querySelector('#login-logout-container-1 .dropdown-menu');
    
                    // Réinitialiser le contenu du menu
                    dropdownMenu.innerHTML = '';
    
                    if (data.logged_in) {
                        // Option 1: Accéder au profil
                        const profileItem = document.createElement('li');
                        const profileLink = document.createElement('a');
                        profileLink.classList.add('dropdown-item');
                        profileLink.href = 'profile.html'; // Remplacez par le lien vers la page de profil
                        profileLink.textContent = 'Profil';
                        profileItem.appendChild(profileLink);
                        dropdownMenu.appendChild(profileItem);
    
                        // Option 2: Déconnexion
                        const logoutItem = document.createElement('li');
                        const logoutLink = document.createElement('a');
                        logoutLink.classList.add('dropdown-item');
                        logoutLink.href = 'form.html';
                        logoutLink.textContent = 'Déconnexion';
                        logoutLink.addEventListener('click', (e) => {
                            e.preventDefault();
                            logoutUser();
                        });
                        logoutItem.appendChild(logoutLink);
                        dropdownMenu.appendChild(logoutItem);
    
                        // Afficher le lien "Gestion des films" si nécessaire
                        const filmManagementLink = document.getElementById('film-management');
                        if (filmManagementLink) {
                            filmManagementLink.style.display = 'block';
                        }
    
                    } else {
                        // Option 1: Connexion
                        const loginItem = document.createElement('li');
                        const loginLink = document.createElement('a');
                        loginLink.classList.add('dropdown-item');
                        loginLink.href = 'form.html'; // Remplacez par le lien vers la page de connexion
                        loginLink.textContent = 'Login';
                        loginItem.appendChild(loginLink);
                        dropdownMenu.appendChild(loginItem);
    
                        // Masquer le lien "Gestion des films" si nécessaire
                        const filmManagementLink = document.getElementById('film-management');
                        if (filmManagementLink) {
                            filmManagementLink.style.display = 'none';
                        }
                    }
                })
                .catch(error => console.error('Erreur lors de la vérification de la session:', error));
        }
    
        // Fonction pour déconnecter l'utilisateur
        function logoutUser() {
            fetch('logout.php')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        checkLoginStatus(); // Réactualiser l'état après la déconnexion
                        // Rediriger l'utilisateur vers la page d'accueil ou la page de connexion
                        window.location.href = 'index.html'; // Ou 'login.html'
                    }
                })
                .catch(error => console.error('Erreur lors de la déconnexion:', error));
        }

    
        // Vérifiez l'état de connexion au chargement
        document.addEventListener('DOMContentLoaded', checkLoginStatus);
    </script>




    <!-- Ajouter les scripts JavaScript de Bootstrap -->

</body>
</html>
