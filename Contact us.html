<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="icon" href="img/pg/WhatsApp Image 2024-04-29 à 18.36.19_cd6fd2e1.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Contact us.css">
</head>
<body>
    <main class="navbar">
        <div class="nav-left">
            <a href="index.html">CHAGU MOVIES</a>
        </div>
        <div class="nav-center">
            <a href="index.html">Home</a>
            <a href="film.html">Movies</a>
            
        </div>
        <a href="ajouter_supprimer_film.html" id="film-management" style="display: none;">Gestion des films</a>
        <div class="nav-right">
            <span id="login-logout-container"></span>
        </div>
    </main>
    <div class="container">
        <form action="https://api.web3forms.com/submit" method="POST">
            <h1>Contact Us</h1>
            <input type="hidden" name="access_key" value="2e2d46d8-2ac1-4a50-9fcd-c0368384d360">
            <input type="text" class="form-style" name="firstName" placeholder="First Name" required>
            <input type="text" class="form-style" name="lastName" placeholder="Last Name" required>
            <input type="email" class="form-style" name="email" placeholder="Email" id="email"required>
            <input type="text" class="form-style" name="mobile" placeholder="Mobile" required>
            <h4>Type Your Message Here...</h4>
            <textarea required class="form-style" name="message" placeholder="Message"></textarea>    
            <input type="submit" class="form-style" value="Send" id="button">
        </form>
        
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>

        // Fonction pour vérifier l'état de connexion
    function checkLoginStatus() {
            fetch('check_session.php')
                .then(response => response.json())
                .then(data => {
                    const loginLogoutContainer = document.getElementById('login-logout-container');
                    const filmManagementLink = document.getElementById('film-management');

                    if (data.logged_in) {
                        // Afficher le bouton de déconnexion
                        loginLogoutContainer.innerHTML = '<a href="index.html" onclick="logoutUser()"><button class="botton">Déconnexion</button></a>';

                        // Afficher le lien "Gestion des films"
                        filmManagementLink.style.display = 'block';
                    } else {
                        // Afficher le bouton de connexion
                        loginLogoutContainer.innerHTML = '<a href="form.html"><button class="botton">Login</button></a>';

                        // Masquer le lien "Gestion des films"
                        filmManagementLink.style.display = 'none';
                    }
                })
                .catch(error => console.error('Erreur lors de la vérification de la session:', error));
        } 
        document.addEventListener('DOMContentLoaded', checkLoginStatus);
  

// Fonction pour déconnecter l'utilisateur
function logoutUser() {
            fetch('logout.php')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        checkLoginStatus(); // Réactualiser l'état après la déconnexion
                    }
                })
                .catch(error => console.error('Erreur lors de la déconnexion:', error));
        }
    
        // Vérifiez l'état de connexion au chargement
        document.addEventListener('DOMContentLoaded', checkLoginStatus);
    

</script>
</body>
</html>
